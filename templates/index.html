<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📝 My Todo List</h1>
        
        <div class="add-todo">
            <input type="text" id="todoInput" placeholder="What needs to be done?" />
            <button onclick="addTodo()">Add</button>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterTodos('all')">All</button>
            <button class="filter-btn" onclick="filterTodos('active')">Active</button>
            <button class="filter-btn" onclick="filterTodos('completed')">Completed</button>
        </div>

        <ul id="todoList" class="todo-list">
            {% for todo in todos %}
            <li class="todo-item {% if todo.completed %}completed{% endif %}" data-id="{{ todo.id }}">
                <input type="checkbox" 
                       {% if todo.completed %}checked{% endif %}
                       onchange="toggleTodo({{ todo.id }}, this.checked)">
                <span class="todo-title">{{ todo.title }}</span>
                <button class="delete-btn" onclick="deleteTodo({{ todo.id }})">×</button>
            </li>
            {% endfor %}
        </ul>

        <div class="todo-stats">
            <span id="itemCount">{{ todos|length }} items</span>
        </div>
    </div>

    <script>
        let currentFilter = 'all';

        async function addTodo() {
            const input = document.getElementById('todoInput');
            const title = input.value.trim();
            
            if (!title) return;
            
            try {
                const response = await fetch('/api/todos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title: title })
                });
                
                if (response.ok) {
                    const todo = await response.json();
                    input.value = '';
                    location.reload();
                }
            } catch (error) {
                console.error('Error adding todo:', error);
            }
        }

        async function toggleTodo(id, completed) {
            try {
                const response = await fetch(`/api/todos/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ completed: completed })
                });
                
                if (response.ok) {
                    const todoItem = document.querySelector(`li[data-id="${id}"]`);
                    if (completed) {
                        todoItem.classList.add('completed');
                    } else {
                        todoItem.classList.remove('completed');
                    }
                    applyFilter();
                }
            } catch (error) {
                console.error('Error updating todo:', error);
            }
        }

        async function deleteTodo(id) {
            try {
                const response = await fetch(`/api/todos/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    location.reload();
                }
            } catch (error) {
                console.error('Error deleting todo:', error);
            }
        }

        function filterTodos(filter) {
            currentFilter = filter;
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            applyFilter();
        }

        function applyFilter() {
            const todos = document.querySelectorAll('.todo-item');
            let visibleCount = 0;
            
            todos.forEach(todo => {
                const isCompleted = todo.classList.contains('completed');
                let show = false;
                
                if (currentFilter === 'all') {
                    show = true;
                } else if (currentFilter === 'active') {
                    show = !isCompleted;
                } else if (currentFilter === 'completed') {
                    show = isCompleted;
                }
                
                todo.style.display = show ? 'flex' : 'none';
                if (show) visibleCount++;
            });
            
            document.getElementById('itemCount').textContent = `${visibleCount} items`;
        }

        // Allow Enter key to add todo
        document.getElementById('todoInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTodo();
            }
        });
    </script>
</body>
</html>
